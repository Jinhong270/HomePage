<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../js/theme-init.js?v=8"></script>
  <title>Terminal — Jinhong270</title>
  <meta name="description" content="Guest terminal for jh270.com. Explore the public repositories and open ECHO COURIER, an original game about your 2.7-second echo.">
  <meta name="theme-color" content="#080a07">
  <link rel="canonical" href="https://jh270.com/terminal/">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://api.github.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css?v=8">
  <link rel="stylesheet" href="../css/terminal.css?v=8">
  <link rel="stylesheet" href="../css/arcade.css?v=9">
</head>
<body class="page-terminal">
  <a class="skip" href="#cmd">Skip to the prompt</a>
  <main class="term" id="content">
    <header class="term-bar">
      <a class="brand" href="../">
        <span class="brand-mark">JH</span>
        <span>TERMINAL<small>JH270.COM</small></span>
      </a>
      <p class="term-id">guest@jh270.com</p>
      <span class="term-spacer"></span>
      <a class="bar-btn" href="../">Home</a>
      <button type="button" class="theme-btn" data-theme-toggle aria-label="Theme is light. Activate to switch to dark.">
        <span class="theme-swap" data-theme-label>DAY</span>
      </button>
    </header>
    <div id="screen" class="screen" role="log"></div>
    <div id="menu" class="menu" role="listbox" aria-label="Commands" hidden></div>
    <form id="composer" class="composer" autocomplete="off">
      <label id="prompt-label" for="cmd">guest@jh270.com:~$</label>
      <input id="cmd" name="command" maxlength="512" role="combobox" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" placeholder="Type /help or ls" aria-label="Command" aria-autocomplete="list" aria-controls="menu" aria-expanded="false">
    </form>
    <footer class="term-status">
      <span>guest@jh270.com</span>
      <span>en-US</span>
      <span id="term-theme">theme</span>
      <span>Esc finishes · Ctrl+C stops · Ctrl+L clears</span>
      <span id="queue-count" role="status"></span>
    </footer>
  </main>
  <script src="../js/theme.js?v=8"></script>
  <script src="../js/github-data.js?v=8"></script>
  <script src="../js/commands.js?v=8"></script>
  <script src="../js/arcade.js?v=9"></script>
  <script src="../js/terminal.js?v=8"></script>
</body>
</html>
