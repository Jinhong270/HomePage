<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function () {
      var saved = "";
      try { saved = localStorage.getItem("jh270-theme") || ""; } catch (err) {}
      if (saved !== "light" && saved !== "dark") {
        saved = "";
        try { localStorage.removeItem("jh270-theme"); } catch (err) {}
      }
      var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = saved || (dark ? "dark" : "light");
      var root = document.documentElement;
      root.dataset.theme = theme;
      root.dataset.themeChoice = saved || "system";
    })();
  </script>
  <title>Repository — Jinhong270</title>
  <meta name="description" content="Details, README, and commit history for a public repository of Jinhong270, read in your browser from GitHub.">
  <meta name="theme-color" content="#080a07">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://api.github.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/site.css?v=6">
  <link rel="stylesheet" href="../css/repo.css?v=6">
</head>
<body class="page-repo">
  <a class="skip" href="#content">Skip to content</a>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="../">
        <span class="brand-mark">JH</span>
        <span>JH270<small>JINHONG270</small></span>
      </a>
      <nav class="nav" aria-label="Page">
        <a href="../#work">Work</a>
        <a href="../#github">GitHub</a>
        <a href="../terminal/">Terminal</a>
      </nav>
      <button type="button" class="theme-btn" data-theme-toggle aria-label="Theme is light. Activate to switch to dark.">
        <span class="theme-swap" data-theme-label>DAY</span>
      </button>
      <script>
        (function () {
          var dark = document.documentElement.dataset.theme === "dark";
          var label = document.querySelector("[data-theme-label]");
          var button = document.querySelector("[data-theme-toggle]");
          var name = dark ? "Theme is dark. Activate to switch to light." : "Theme is light. Activate to switch to dark.";
          if (label) label.textContent = dark ? "NIGHT" : "DAY";
          if (!button) return;
          button.setAttribute("aria-label", name);
          button.title = name;
        })();
      </script>
    </div>
  </header>
  <main id="content" class="wrap">
    <div id="repo-mount" class="repo-page" aria-busy="true">
      <p class="note">Reading the repository in this browser…</p>
    </div>
    <noscript>
      <p class="note">JavaScript is off, so this page cannot ask GitHub. The account is <a href="https://github.com/Jinhong270">github.com/Jinhong270</a>.</p>
    </noscript>
  </main>
  <footer class="statusline">
    <div class="statusline-inner">
      <span>jh270.com</span>
      <span>guest@jh270.com</span>
      <span>en-US</span>
      <span id="clock">--:--:--</span>
    </div>
  </footer>
  <script src="../js/theme.js?v=6"></script>
  <script src="../js/github-data.js?v=6"></script>
  <script src="../js/home.js?v=6"></script>
  <script src="../js/repo.js?v=6"></script>
</body>
</html>
